# ===========================================
# 本地开发配置 (java -jar xxx.jar --spring.profiles.active=local)
# 使用 H2 文件数据库，无需 Docker，开箱即用
# ===========================================

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  cache:
    type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging:
  level:
    com.blog: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: local-dev-secret-not-for-production
  ai:
    api-key: ${AI_API_KEY:}
