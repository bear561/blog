# ===========================================
# 本地开发配置
# 使用虚拟机里的 MySQL（无需 Docker / Redis）
# 启动: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ===========================================
# 占位符: 把 <...> 替换成你 VM 的实际值
#   <VM_IP>          例如 192.168.1.100
#   <MYSQL_USER>     例如 root
#   <MYSQL_PASSWORD> 例如 root123
# ===========================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: '@Xj051108'
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  cache:
    type: none
  sql:
    init:
      mode: never   # 表结构在 VM 上手动跑 docker/mysql/init.sql

logging:
  level:
    com.blog: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: local-dev-secret-not-for-production
  upload:
    path: d:/blog/uploads

# AI 配置（本地开发直接写这里）
ai:
  api-key: sk-cc680ce7b0194886bd91faf6076bd50f
  model: deepseek-v4-flash
  base-url: https://api.deepseek.com/v1
