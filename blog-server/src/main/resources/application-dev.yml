# ===========================================
# 开发联调配置 (java -jar xxx.jar --spring.profiles.active=dev)
# 依赖 Docker 中的 MySQL + Redis，通过 127.0.0.1 连接
# 启动前需: docker-compose up -d mysql redis
# ===========================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: blog
    password: blog123
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cache:
    type: redis
  sql:
    init:
      mode: never

logging:
  level:
    com.blog: INFO

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: dev-secret-change-in-production
