server:
  port: ${SERVER_PORT:8080}

ai:
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  upload:
    path: ${UPLOAD_PATH:./uploads}
