events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 允许大请求体（文章配图上传），与后端 spring.multipart 10MB 对齐；
    # 默认 1MB，超了会直接 413 且到不了后端
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # HTTP：证书续期验证路径 + 其余全部跳转 HTTPS
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 续期验证（不跳转）
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 主站
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/blog-ssl/fullchain.pem;
        ssl_certificate_key /etc/blog-ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 上传文件
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://server:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for AI chat
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 管理端
        location /admin {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
        }

        # 用户端（用root代替alias，避免alias+try_files+index的兼容问题）
        location / {
            root /usr/share/nginx/html/frontend;
            try_files $uri $uri/ /index.html;
            index index.html;
        }
    }
}
