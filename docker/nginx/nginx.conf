events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebP 内容协商：浏览器 Accept 头里有 image/webp 就返回同名的 .webp 副本
    # （上传时由 FileService 调 cwebp 生成，路径与数据库里存的 URL 完全一致，只多一个后缀），
    # 否则回退原图。老图没有 .webp 副本时，try_files 会直接落到 $uri。
    map $http_accept $webp_suffix {
        default        "";
        "~*image/webp" ".webp";
    }

    sendfile        on;
    keepalive_timeout  65;

    # 允许大请求体（文章配图上传），与后端 spring.multipart 10MB 对齐；
    # 默认 1MB，超了会直接 413 且到不了后端
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # HTTP：证书续期验证路径 + 其余全部跳转 HTTPS
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 续期验证（不跳转）
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 主站
    server {
        # http2：首页一次要拉十几张图，HTTP/1.1 的 6 连接上限会排队
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/blog-ssl/fullchain.pem;
        ssl_certificate_key /etc/blog-ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 上传文件
        # 必须用 root 而不是 alias —— alias 和 try_files 组合有已知缺陷
        location /uploads/ {
            root /usr/share/nginx/html;
            try_files $uri$webp_suffix $uri =404;
            expires 30d;
            add_header Cache-Control "public";
            # 同一个 URL 会按 Accept 头返回两种内容，必须声明 Vary，否则中间缓存会串味；
            # 也正因为如此，这里不能像 /assets/ 那样用 immutable
            add_header Vary Accept;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://server:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for AI chat
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 管理端
        location /admin {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
        }

        # 前端构建产物：Vite 文件名自带内容哈希，一个 URL 恒定一份内容，可以放心长效缓存
        location /assets/ {
            root /usr/share/nginx/html/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 用户端（用root代替alias，避免alias+try_files+index的兼容问题）
        location / {
            root /usr/share/nginx/html/frontend;
            try_files $uri $uri/ /index.html;
            index index.html;
        }
    }
}
