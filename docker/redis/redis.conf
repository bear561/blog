# Redis configuration
port 6379
bind 0.0.0.0

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Security
# 密码由 docker-compose 以 --requirepass 从 .env 注入（不写进仓库）
# 容器未发布 6379 到宿主机，仅 blog-network 内可连（server 靠 requirepass 认证）
protected-mode yes
