version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 时区必须与 JDBC serverTimezone=Asia/Shanghai 一致，否则 LocalDateTime 偏差 8 小时
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    # 6379 对外开放（用户确认）。安全基线：必须保留 requirepass 密码，
    # 并配合腾讯云安全组：入站仅放行你的 IP（勿用 0.0.0.0/0）
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./blog-server
      dockerfile: Dockerfile
    image: blog-server:latest
    container_name: blog-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # TZ 与 Dockerfile 里的 -Duser.timezone=Asia/Shanghai 保持一致（显式声明，便于线上排查）
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: blog
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-blog123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
    volumes:
      - uploads-data:/app/uploads
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx:alpine 原生无 tzdata，TZ 环境变量对日志时间无效；
      # 配合挂载宿主机 /etc/localtime（宿主先改为 Asia/Shanghai）让 access log 显示北京时间
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./blog-frontend/dist:/usr/share/nginx/html/frontend
      - ./blog-admin/dist:/usr/share/nginx/html/admin
      - uploads-data:/usr/share/nginx/html/uploads
      - /etc/blog-ssl:/etc/blog-ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/acme:/var/www/acme
    depends_on:
      - server
    networks:
      - blog-network

volumes:
  mysql-data:
  redis-data:
  uploads-data:

networks:
  blog-network:
    driver: bridge
