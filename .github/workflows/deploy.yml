name: Deploy Blog System

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Info
        run: |
          echo "========================================="
          echo "部署信息："
          echo "SERVER_HOST: ${{ secrets.SERVER_HOST }}"
          echo "SERVER_USER: ${{ secrets.SERVER_USER }}"
          echo "DEPLOY_DIR: /var/www/blog"
          echo "========================================="

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          echo "SSH key 已配置"

      - name: Test SSH connection
        run: |
          echo "测试 SSH 连接..."
          ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{
              secrets.SERVER_USER
            }}@${{
              secrets.SERVER_HOST
            }} \
            "echo 'SSH 连接成功' && hostname && date"

      - name: Create directories
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "创建必要目录..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "mkdir -p ${DEPLOY_DIR} && \
             mkdir -p ${DEPLOY_DIR}/blog-frontend && \
             mkdir -p ${DEPLOY_DIR}/blog-admin && \
             mkdir -p ${DEPLOY_DIR}/blog-server && \
             mkdir -p ${DEPLOY_DIR}/docker/mysql && \
             mkdir -p ${DEPLOY_DIR}/docker/nginx && \
             mkdir -p ${DEPLOY_DIR}/.github/workflows && \
             mkdir -p /var/lib/blog && \
             mkdir -p /var/lib/blog/mysql && \
             mkdir -p /var/lib/blog/redis && \
             mkdir -p /var/lib/blog/uploads && \
             mkdir -p /var/log/blog"
          echo "✅ 目录创建完成"

      - name: Check and setup git repository
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查 Git 仓库配置..."

          # 检查是否是 git 仓库
          if ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && git rev-parse --git-dir 2>/dev/null"; then
            echo "✅ 已是 git 仓库，强制同步到最新"
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cd ${DEPLOY_DIR} && \
               git fetch origin main && \
               git reset --hard origin/main && \
               git clean -fd"
            echo "✅ Git 同步完成"
          else
            echo "❌ 不是 git 仓库，需要重新克隆"
            echo "移除旧目录并从 GitHub clone..."
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "rm -rf ${DEPLOY_DIR} || true"

            # 克隆项目（用 GitHub Token 走 HTTPS，避免服务器没配 SSH key）
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git ${DEPLOY_DIR}"
          fi

          # 验证关键文件存在
          echo "验证项目文件..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "echo 'Git log:' && cd ${DEPLOY_DIR} && git log --oneline -3 && \
             echo '' && \
             echo 'Dockerfile check:' && \
             ls -la ${DEPLOY_DIR}/blog-frontend/Dockerfile && \
             ls -la ${DEPLOY_DIR}/blog-admin/Dockerfile && \
             ls -la ${DEPLOY_DIR}/blog-server/Dockerfile && \
             echo '✅ 所有 Dockerfile 就绪'"

      - name: Build frontend
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "构建前端..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR}/blog-frontend && docker build -t blog-frontend:latest ."

      - name: Build admin
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "构建后台..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR}/blog-admin && docker build -t blog-admin:latest ."

      - name: Build server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "构建后端..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR}/blog-server && docker build -t blog-server:latest ."

      - name: Stop old containers
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "停止旧容器..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker-compose down || echo 'Docker Compose down 完成'"

      - name: Start new containers
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "启动新容器..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker-compose up -d"

      - name: Restart server service
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "重启服务..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker-compose restart server || echo '重启完成'"

      - name: Clean old images
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "清理旧镜像..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker image prune -f"

      - name: Check deployment status
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "服务状态："
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_DIR} && docker-compose ps"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "验证部署状态..."
          sleep 10
          if curl -f http://${{ secrets.SERVER_HOST }} 2>/dev/null; then
            echo "✅ 部署验证成功！"
          else
            echo "⚠️ 前端访问失败，但服务可能已启动"
            exit 1
          fi
