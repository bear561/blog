name: Deploy Blog System

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过 Docker 镜像构建（直接用服务器上已有的镜像）'
        type: boolean
        default: false
        required: false
      skip_git_sync:
        description: '跳过 Git 代码同步'
        type: boolean
        default: false
        required: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Info
        run: |
          echo "========================================="
          echo "部署信息："
          echo "SERVER_HOST: ${{ secrets.SERVER_HOST }}"
          echo "SERVER_USER: ${{ secrets.SERVER_USER }}"
          echo "DEPLOY_DIR: /var/www/blog"
          echo "========================================="

      - name: Setup SSH key
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh ~/.ssh/controlmasters
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          # 配置 SSH keepalive + 连接复用，避免频繁建连被服务器拒绝
          cat >> ~/.ssh/config << 'EOF'
          Host *
              ServerAliveInterval 60
              ServerAliveCountMax 5
              TCPKeepAlive yes
              StrictHostKeyChecking no
              ControlMaster auto
              ControlPath ~/.ssh/controlmasters/%r@%h:%p
              ControlPersist 10m
              ConnectionAttempts 3
          EOF
          echo "SSH key 已配置（runner）"

          # 同时把 SSH key 同步到服务器，供服务器访问 GitHub 使用
          echo "同步 SSH key 到服务器..."
          ssh -i ~/.ssh/github_actions ${SERVER_USER}@${SERVER_HOST} \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh" || true
          scp -i ~/.ssh/github_actions ~/.ssh/github_actions ${SERVER_USER}@${SERVER_HOST}:~/.ssh/github_actions || true
          ssh -i ~/.ssh/github_actions ${SERVER_USER}@${SERVER_HOST} \
            "chmod 600 ~/.ssh/github_actions && \
             grep -q 'Host github.com' ~/.ssh/config 2>/dev/null || \
             printf 'Host github.com\n    IdentityFile ~/.ssh/github_actions\n    StrictHostKeyChecking no\n' >> ~/.ssh/config && \
             echo '✅ 服务器 SSH key 配置完成'"

      - name: Test SSH connection
        run: |
          echo "测试 SSH 连接..."
          ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{
              secrets.SERVER_USER
            }}@${{
              secrets.SERVER_HOST
            }} \
            "echo 'SSH 连接成功' && hostname && date"

      - name: Create directories
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "创建必要目录..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "mkdir -p ${DEPLOY_DIR} && \
             mkdir -p ${DEPLOY_DIR}/blog-frontend && \
             mkdir -p ${DEPLOY_DIR}/blog-admin && \
             mkdir -p ${DEPLOY_DIR}/blog-server && \
             mkdir -p ${DEPLOY_DIR}/docker/mysql && \
             mkdir -p ${DEPLOY_DIR}/docker/nginx && \
             mkdir -p ${DEPLOY_DIR}/.github/workflows && \
             mkdir -p /var/lib/blog && \
             mkdir -p /var/lib/blog/mysql && \
             mkdir -p /var/lib/blog/redis && \
             mkdir -p /var/lib/blog/uploads && \
             mkdir -p /var/log/blog"
          echo "✅ 目录创建完成"

      - name: Check and setup git repository
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_git_sync }}
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查 Git 仓库配置..."

          NEED_CLONE=false

          # 检查是否是有效的 git 仓库（有 .git 且有 origin remote）
          if ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && git rev-parse --git-dir 2>/dev/null && git remote get-url origin 2>/dev/null"; then
            echo "✅ 有效 git 仓库，强制同步到最新"
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cd ${DEPLOY_DIR} && \
               git fetch origin main && \
               git reset --hard origin/main && \
               git clean -fd"
            echo "✅ Git 同步完成"
          else
            echo "⚠️ 仓库不完整或缺少 origin remote，重新克隆..."
            NEED_CLONE=true
          fi

          if [ "$NEED_CLONE" = true ]; then
            echo "移除旧目录并从 GitHub clone..."
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "rm -rf ${DEPLOY_DIR} || true"
            # 克隆项目（SSH 方式，服务器已配置好 key）
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "git clone git@github.com:${GITHUB_REPO}.git ${DEPLOY_DIR}"
          fi

          # 验证关键文件存在
          echo "验证项目文件..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "echo 'Git log:' && cd ${DEPLOY_DIR} && git log --oneline -3 && \
             echo '' && \
             echo 'Dockerfile check:' && \
             ls -la ${DEPLOY_DIR}/blog-frontend/Dockerfile && \
             ls -la ${DEPLOY_DIR}/blog-admin/Dockerfile && \
             ls -la ${DEPLOY_DIR}/blog-server/Dockerfile && \
             echo '✅ 所有 Dockerfile 就绪'"

      - name: Build all Docker images
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          # SSH 重试包装函数（应对偶发断连）
          ssh_retry() {
            local max=3
            for attempt in $(seq 1 $max); do
              if ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} "$@"; then
                return 0
              fi
              echo "  ⚠️ SSH 命令失败 (尝试 $attempt/$max)，等待重试..."
              sleep 5
            done
            return 1
          }

          # 检查某个目录下的源码是否相比上次构建有变化
          need_rebuild() {
            local DIR=$1
            local MARKER="/tmp/.docker-build-${DIR}.commit"
            local CURRENT
            CURRENT=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cd ${DEPLOY_DIR} && git rev-parse HEAD" 2>/dev/null || echo "unknown")
            local LAST
            LAST=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cat ${MARKER} 2>/dev/null || echo 'none'")
            if [ "$LAST" = "$CURRENT" ]; then
              return 1  # 无变化，不需要重建
            fi
            # 检查具体目录是否有变更
            local diff
            diff=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cd ${DEPLOY_DIR} && git diff --name-only ${LAST} HEAD -- ${DIR} 2>/dev/null | head -1 || echo 'CHANGED'")
            if [ -z "$diff" ]; then
              echo "  ⏭️ ${DIR} 源码无变化，跳过构建"
              ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} "echo ${CURRENT} > ${MARKER}"
              return 1
            fi
            return 0  # 有变化，需要重建
          }

          mark_built() {
            local DIR=$1
            local CURRENT
            CURRENT=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "cd ${DEPLOY_DIR} && git rev-parse HEAD" 2>/dev/null || echo "unknown")
            ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} "echo ${CURRENT} > /tmp/.docker-build-${DIR}.commit"
          }

          build_image() {
            local NAME=$1
            local DIR=$2
            local LOG="/tmp/docker-build-${NAME}.log"

            echo "========================================="
            echo "检查 ${NAME} (${DIR}) 是否需要构建..."

            # 如果镜像已存在 且 源码未变化，跳过
            local image_exists
            image_exists=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
              "docker image inspect blog-${NAME}:latest > /dev/null 2>&1 && echo 'yes' || echo 'no'")

            if [ "$image_exists" = "yes" ] && ! need_rebuild "${DIR}"; then
              echo "✅ ${NAME} 无变化，使用缓存镜像"
              return 0
            fi

            echo "🔨 需要重建 ${NAME}..."
            ssh_retry "nohup docker build -t blog-${NAME}:latest ${DEPLOY_DIR}/${DIR} > ${LOG} 2>&1 &"

            echo "等待 ${NAME} 构建完成..."
            local prev_size=0
            for i in $(seq 1 120); do
              sleep 15
              local result
              result=$(ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
                "pgrep -f 'docker build.*blog-${NAME}' > /dev/null 2>&1 && echo 'BUILDING' || echo 'DONE'; wc -l < ${LOG} 2>/dev/null || echo 0" 2>/dev/null || echo "SSH_FAIL")

              local status=$(echo "$result" | head -1)
              local cur_size=$(echo "$result" | tail -1)

              if [ "$status" = "DONE" ]; then
                echo "  ${NAME} 构建进程已结束"
                break
              fi
              if [ "$status" = "SSH_FAIL" ]; then
                echo "  ⚠️ SSH 轮询暂时失败，继续等待..."
              elif [ "$cur_size" -gt "$prev_size" ]; then
                prev_size=$cur_size
                echo "  ${NAME} 构建中... $((i * 15))秒 (日志 ${cur_size} 行)"
              fi
            done

            echo "--- ${NAME} 构建日志（最后40行） ---"
            local check_result
            check_result=$(ssh_retry "tail -40 ${LOG} 2>/dev/null; echo '---SPLIT---'; grep -q 'Successfully built' ${LOG} 2>/dev/null && echo 'BUILD_OK' || echo 'BUILD_FAIL'; docker image inspect blog-${NAME}:latest > /dev/null 2>&1 && echo 'IMAGE_OK' || echo 'IMAGE_MISSING'" || echo "SSH_FAILED")

            echo "$check_result" | sed '/---SPLIT---/,$d' || echo "$check_result"
            echo "--- 日志结束 ---"

            if echo "$check_result" | grep -q 'BUILD_OK'; then
              echo "✅ ${NAME} 构建成功！(log check: BUILD_OK)"
              mark_built "${DIR}"
            elif echo "$check_result" | grep -q 'IMAGE_OK'; then
              echo "✅ ${NAME} 构建成功！(image exists)"
              mark_built "${DIR}"
            else
              echo "❌ ${NAME} 构建失败！"
              ssh_retry "cat ${LOG}" || true
              exit 1
            fi
          }

          build_image "frontend" "blog-frontend"
          build_image "admin" "blog-admin"
          build_image "server" "blog-server"

      - name: Stop old containers
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "停止并清理旧容器..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} << 'REMOTE_CLEANUP'
            set -e
            cd /var/www/blog

            echo "1. docker-compose down..."
            docker-compose down --remove-orphans --timeout 30 2>&1 || true

            echo "2. 强制删除所有 blog-* 容器（不管状态）..."
            CONTAINERS=$(docker ps -a --filter "name=blog-" -q)
            if [ -n "$CONTAINERS" ]; then
              echo "  发现容器: $CONTAINERS"
              docker rm -f $CONTAINERS && echo "  已删除"
            else
              echo "  无残留容器"
            fi

            echo "3. 检查端口占用..."
            if ss -tlnp | grep -q ':6379'; then
              echo "  ⚠️ 6379 端口仍被占用:"
              ss -tlnp | grep ':6379'
              echo "  尝试释放..."
              fuser -k 6379/tcp 2>/dev/null || true
            fi
            if ss -tlnp | grep -q ':3306'; then
              echo "  ⚠️ 3306 端口仍被占用:"
              ss -tlnp | grep ':3306'
              echo "  尝试释放..."
              fuser -k 3306/tcp 2>/dev/null || true
            fi

            echo "✅ 清理完成"
          REMOTE_CLEANUP

      - name: Start new containers
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "启动新容器..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker-compose up -d"

      - name: Restart server service
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "重启服务..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker-compose restart server || echo '重启完成'"

      - name: Clean old images
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "清理旧镜像..."
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} \
            "cd ${DEPLOY_DIR} && docker image prune -f"

      - name: Check deployment status
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_DIR: /var/www/blog
          SSH_KEY: ~/.ssh/github_actions
        run: |
          echo "服务状态："
          ssh -i ${SSH_KEY} ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_DIR} && docker-compose ps"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "验证部署状态..."
          sleep 10
          if curl -f http://${{ secrets.SERVER_HOST }} 2>/dev/null; then
            echo "✅ 部署验证成功！"
          else
            echo "⚠️ 前端访问失败，但服务可能已启动"
            exit 1
          fi
